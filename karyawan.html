<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Karyawan & Absensi | Rachma Laundry Mart</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#fef2f2',
              100: '#ffe1e1',
              500: '#ef4444',
              600: '#dc2626',
              700: '#b91c1c',
            },
            dark: '#0f172a'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    .fade-up {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp .5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .delay-1 { animation-delay: .05s }
    .delay-2 { animation-delay: .10s }
    .delay-3 { animation-delay: .15s }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 max-w-md mx-auto min-h-screen relative pb-28">

  <!-- AUDIO SFX -->
  <audio id="soundClick" src="https://assets.mixkit.co/sfx/preview/mixkit-soft-click-1125.mp3"></audio>
  <audio id="soundMasuk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>
  <audio id="soundPulang" src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3"></audio>

  <!-- HEADER -->
  <header class="bg-gradient-to-br from-primary-600 via-primary-700 to-red-900 text-white pt-6 pb-16 px-5 rounded-b-[2.5rem] shadow-lg sticky top-0 z-20">
    <div class="flex items-center justify-between">
      <a href="javascript:history.back()" class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-md flex items-center justify-center text-white border border-white/20 active:scale-95 transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div class="text-center">
        <h1 class="text-base font-bold leading-tight">Kelola Kurir & Absensi</h1>
        <p class="text-[11px] text-red-100/90 font-medium">Rachma Laundry Mart</p>
      </div>
      <div class="w-10"></div> <!-- Spacer Balance -->
    </div>
  </header>

  <!-- FORM TAMBAH KARYAWAN -->
  <section class="-mt-10 px-4 relative z-30 fade-up delay-1">
    <div class="bg-white rounded-3xl p-5 shadow-lg border border-slate-100 space-y-3.5">
      <div class="flex items-center gap-2 border-b border-slate-100 pb-2.5">
        <div class="w-8 h-8 rounded-xl bg-primary-50 text-primary-600 flex items-center justify-center">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
        </div>
        <h2 class="font-bold text-slate-800 text-sm">Tambah Kurir Baru</h2>
      </div>

      <div>
        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 block">Nama Lengkap</label>
        <input id="nama" type="text" placeholder="Masukkan Nama Kurir" class="w-full bg-slate-50 border border-slate-200 focus:border-primary-600 focus:bg-white text-xs p-3 rounded-xl outline-none transition">
      </div>

      <div>
        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 block">Jabatan</label>
        <input value="Kurir Laundry" disabled class="w-full bg-slate-100 border border-slate-200 text-xs p-3 rounded-xl text-slate-500 font-medium cursor-not-allowed">
      </div>

      <div>
        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 block">Foto Profil</label>
        <input id="foto" type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-primary-50 file:text-primary-600 hover:file:bg-primary-100 cursor-pointer">
      </div>

      <button onclick="tambahKaryawan()" class="w-full bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-xl font-bold text-xs shadow-md active:scale-95 transition flex items-center justify-center gap-2">
        <i data-lucide="save" class="w-4 h-4"></i>
        <span>Simpan Kurir</span>
      </button>
    </div>
  </section>

  <!-- DAFTAR KURIR -->
  <section class="px-4 mt-6 fade-up delay-2">
    <div class="flex items-center justify-between mb-3.5">
      <div class="flex items-center gap-2">
        <i data-lucide="users" class="w-4 h-4 text-primary-600"></i>
        <h2 class="font-bold text-slate-800 text-sm">Daftar Kurir & Absensi</h2>
      </div>
      <span id="totalKurir" class="text-[10px] font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0 Kurir</span>
    </div>

    <!-- CONTAINER LIST KARYAWAN -->
    <div id="list" class="space-y-3">
      <!-- Item injected by JS -->
    </div>
  </section>

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 max-w-md mx-auto px-6 py-2 z-50">
    <div class="flex justify-between items-center">
      
      <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition">
        <i data-lucide="layout-grid" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">Dashboard</span>
      </a>

      <a href="cashier.html" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition">
        <i data-lucide="receipt" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">Kasir</span>
      </a>

      <a href="karyawan.html" class="flex flex-col items-center text-primary-600">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold mt-1">Karyawan</span>
      </a>

      <a href="setting.html" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">Setting</span>
      </a>

    </div>
  </nav>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let data = JSON.parse(localStorage.getItem('karyawan')) || [];

    /* SFX PLAYER */
    function play(id){
      let s = document.getElementById(id);
      if(s) {
        s.currentTime = 0;
        s.play().catch(()=>{});
      }
    }

    /* SAVE TO LOCALSTORAGE */
    function save(){
      localStorage.setItem('karyawan', JSON.stringify(data));
    }

    /* TAMBAH KARYAWAN */
    function tambahKaryawan(){
      play('soundClick');
      let nama = document.getElementById('nama').value.trim();
      let fotoInput = document.getElementById('foto');

      if(!nama || !fotoInput.files[0]){
        alert("Lengkapi nama dan foto kurir!");
        return;
      }

      let reader = new FileReader();
      reader.onload = e => {
        data.push({
          nama: nama,
          jabatan: 'Kurir Laundry',
          foto: e.target.result,
          masuk: '-',
          pulang: '-'
        });
        save();
        render();
      };
      reader.readAsDataURL(fotoInput.files[0]);

      document.getElementById('nama').value = '';
      document.getElementById('foto').value = '';
    }

    /* ABSENSI MASUK / PULANG */
    function absensi(i, type){
      let jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      data[i][type] = jam + ' WIB';

      if(type === 'masuk') play('soundMasuk');
      if(type === 'pulang') play('soundPulang');

      save();
      render();
    }

    /* EDIT NAMA */
    function editData(i){
      play('soundClick');
      let newName = prompt("Edit Nama Kurir:", data[i].nama);
      if(newName && newName.trim() !== ""){
        data[i].nama = newName.trim();
        save();
        render();
      }
    }

    /* HAPUS KURIR */
    function hapus(i){
      play('soundClick');
      if(confirm(`Yakin ingin menghapus data kurir ${data[i].nama}?`)){
        data.splice(i, 1);
        save();
        render();
      }
    }

    /* RENDER LIST */
    function render(){
      let list = document.getElementById('list');
      let totalKurir = document.getElementById('totalKurir');
      list.innerHTML = '';

      totalKurir.innerText = `${data.length} Kurir`;

      if(data.length === 0) {
        list.innerHTML = `
          <div class="bg-white rounded-2xl p-6 text-center border border-slate-100">
            <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-2">
              <i data-lucide="user-x" class="w-6 h-6"></i>
            </div>
            <p class="text-xs font-semibold text-slate-600">Belum Ada Data Kurir</p>
            <p class="text-[10px] text-slate-400 mt-0.5">Tambahkan kurir pertama Anda pada form di atas.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      data.forEach((k, i) => {
        list.innerHTML += `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-3.5 items-start">
            <img src="${k.foto}" class="w-14 h-14 rounded-2xl object-cover ring-2 ring-slate-100 shrink-0">
            
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-xs text-slate-800 truncate">${k.nama}</h3>
                <span class="text-[9px] font-bold bg-primary-50 text-primary-600 px-2 py-0.5 rounded-md">${k.jabatan}</span>
              </div>

              <!-- STATUS ABSENSI -->
              <div class="grid grid-cols-2 gap-2 mt-2 bg-slate-50 p-2 rounded-xl text-[10px]">
                <div>
                  <span class="text-slate-400 block text-[9px]">Jam Masuk</span>
                  <span class="font-bold text-emerald-600">${k.masuk}</span>
                </div>
                <div>
                  <span class="text-slate-400 block text-[9px]">Jam Pulang</span>
                  <span class="font-bold text-blue-600">${k.pulang}</span>
                </div>
              </div>

              <!-- ACTION BUTTONS -->
              <div class="grid grid-cols-4 gap-1.5 mt-3">
                <button onclick="absensi(${i},'masuk')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-1.5 px-1 rounded-lg text-[10px] flex items-center justify-center gap-1 transition active:scale-95">
                  <i data-lucide="log-in" class="w-3 h-3"></i> Masuk
                </button>

                <button onclick="absensi(${i},'pulang')" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-1.5 px-1 rounded-lg text-[10px] flex items-center justify-center gap-1 transition active:scale-95">
                  <i data-lucide="log-out" class="w-3 h-3"></i> Pulang
                </button>

                <button onclick="editData(${i})" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-1.5 px-1 rounded-lg text-[10px] flex items-center justify-center gap-1 transition active:scale-95">
                  <i data-lucide="edit-2" class="w-3 h-3"></i> Edit
                </button>

                <button onclick="hapus(${i})" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold py-1.5 px-1 rounded-lg text-[10px] flex items-center justify-center gap-1 transition active:scale-95">
                  <i data-lucide="trash-2" class="w-3 h-3"></i> Hapus
                </button>
              </div>
            </div>
          </div>
        `;
      });

      lucide.createIcons();
    }

    // Initial render
    render();
  </script>
</body>
</html>
